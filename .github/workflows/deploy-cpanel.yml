name: Deploy cPanel Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build member web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build admin
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/qismat_deploy
          chmod 600 ~/.ssh/qismat_deploy
          eval "$(ssh-agent -s)"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_KEY_PASSPHRASE"' > "$RUNNER_TEMP/qismat_ssh_askpass"
          chmod 700 "$RUNNER_TEMP/qismat_ssh_askpass"
          SSH_ASKPASS="$RUNNER_TEMP/qismat_ssh_askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            ssh-add ~/.ssh/qismat_deploy < /dev/null
          rm -f "$RUNNER_TEMP/qismat_ssh_askpass"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy static frontends
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          ADMIN_PATH: ${{ secrets.CPANEL_ADMIN_PATH }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/qismat_deploy -p ${PORT:-22}" web/dist/ "$USER@$HOST:$WEB_PATH/"
          rsync -az --delete -e "ssh -i ~/.ssh/qismat_deploy -p ${PORT:-22}" admin/dist/ "$USER@$HOST:$ADMIN_PATH/"

      - name: Deployment note
        run: echo "Frontend deployment completed for ${{ inputs.ref }}. Backend deployment remains gated until Laravel bootstrap is complete."
