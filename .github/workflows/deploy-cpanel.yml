name: Deploy cPanel Staging

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'admin/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: cpanel-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'shihan84/qismat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set release identifier
        run: echo "RELEASE_ID=${GITHUB_RUN_ID}-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          ADMIN_PATH: ${{ secrets.CPANEL_ADMIN_PATH }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LARAVEL_APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: |
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KEY_PASSPHRASE"
          test -n "$API_PATH"
          test -n "$WEB_PATH"
          test -n "$ADMIN_PATH"
          test -n "$DATABASE_NAME"
          test -n "$DATABASE_USER"
          test -n "$DATABASE_PASSWORD"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_WEB_API_KEY"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          test -n "$LARAVEL_APP_KEY"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Build Laravel backend
        working-directory: backend
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build member web
        working-directory: web
        env:
          VITE_API_BASE_URL: https://admin.qismatconnections.com/api/v1
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npm ci
          npm run build

      - name: Build admin
        working-directory: admin
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: bash .github/scripts/configure-ssh.sh ~/.ssh/qismat_deploy

      - name: Verify deployment database
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          local_credentials="$RUNNER_TEMP/qismat-db-check.cnf"
          remote_credentials="/tmp/qismat-deploy-db-${GITHUB_RUN_ID}.cnf"
          cleanup() {
            rm -f "$local_credentials"
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
              "rm -f '$remote_credentials'" || true
          }
          trap cleanup EXIT
          php .github/scripts/write-mysql-option-file.php "$local_credentials"
          chmod 600 "$local_credentials"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            "$local_credentials" "$USER@$HOST:$remote_credentials"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            "chmod 600 '$remote_credentials' && (mysql --defaults-extra-file='$remote_credentials' '$DATABASE_NAME' -e 'SELECT 1 AS connection_ok' || mariadb --defaults-extra-file='$remote_credentials' '$DATABASE_NAME' -e 'SELECT 1 AS connection_ok')"

      - name: Prepare Laravel environment
        env:
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LARAVEL_APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
        run: |
          php -r '
          $values = [
              "APP_NAME" => "Qismat",
              "APP_ENV" => "production",
              "APP_KEY" => getenv("LARAVEL_APP_KEY"),
              "APP_DEBUG" => "false",
              "APP_URL" => "https://admin.qismatconnections.com",
              "LOG_CHANNEL" => "stack",
              "LOG_LEVEL" => "warning",
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "localhost",
              "DB_PORT" => "3306",
              "DB_DATABASE" => getenv("DATABASE_NAME"),
              "DB_USERNAME" => getenv("DATABASE_USER"),
              "DB_PASSWORD" => getenv("DATABASE_PASSWORD"),
              "SESSION_DRIVER" => "database",
              "QUEUE_CONNECTION" => "database",
              "CACHE_STORE" => "database",
              "FIREBASE_PROJECT_ID" => getenv("FIREBASE_PROJECT_ID"),
              "FIREBASE_WEB_API_KEY" => getenv("FIREBASE_WEB_API_KEY"),
              "FIREBASE_CREDENTIALS" => getenv("API_PATH")."/.secrets/firebase-service-account.json",
              "FILESYSTEM_DISK" => "public",
              "FRONTEND_URL" => "https://qismatconnections.com",
              "FRONTEND_WWW_URL" => "https://www.qismatconnections.com",
              "ADMIN_URL" => "https://admin.qismatconnections.com",
              "SANCTUM_STATEFUL_DOMAINS" => "qismatconnections.com,www.qismatconnections.com,admin.qismatconnections.com",
          ];
          foreach ($values as $name => $value) {
              echo $name."=".json_encode($value, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          ' > "$RUNNER_TEMP/qismat.env"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/qismat.env" "$RUNNER_TEMP/firebase-service-account.json"

      - name: Back up database and member files
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          local_credentials="$RUNNER_TEMP/qismat-backup-db.cnf"
          remote_credentials="/tmp/qismat-backup-db-${GITHUB_RUN_ID}.cnf"
          cleanup() {
            rm -f "$local_credentials"
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
              "rm -f '$remote_credentials'" || true
          }
          trap cleanup EXIT
          php .github/scripts/write-mysql-option-file.php "$local_credentials"
          chmod 600 "$local_credentials"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            "$local_credentials" "$USER@$HOST:$remote_credentials"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            "mkdir -p '$API_PATH' && chmod 600 '$remote_credentials'"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            bash -s -- "$API_PATH" "$DATABASE_NAME" "$remote_credentials" "predeploy-$RELEASE_ID" 14 \
            < .github/scripts/backup-cpanel.sh

      - name: Stage release
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          ADMIN_PATH: ${{ secrets.CPANEL_ADMIN_PATH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            "mkdir -p '$API_PATH/releases/$RELEASE_ID' '$API_PATH/.secrets' '$API_PATH/deployment' '$WEB_PATH/releases/$RELEASE_ID' '$WEB_PATH/assets' '$ADMIN_PATH/releases/$RELEASE_ID' '$ADMIN_PATH/assets' && chmod 700 '$API_PATH/.secrets'"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.secrets/' \
            --exclude='.phpunit.result.cache' \
            --exclude='database/database.sqlite' \
            --exclude='public/storage' \
            --exclude='public/.well-known/' \
            --exclude='public/cgi-bin/' \
            --exclude='storage/' \
            --exclude='tests/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p ${PORT:-22}" \
            backend/ "$USER@$HOST:$API_PATH/releases/$RELEASE_ID/"
          rsync -az --delete -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p ${PORT:-22}" \
            web/dist/ "$USER@$HOST:$WEB_PATH/releases/$RELEASE_ID/"
          rsync -az --delete -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p ${PORT:-22}" \
            admin/dist/ "$USER@$HOST:$ADMIN_PATH/releases/$RELEASE_ID/"
          rsync -az -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p ${PORT:-22}" \
            web/dist/assets/ "$USER@$HOST:$WEB_PATH/assets/"
          rsync -az -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p ${PORT:-22}" \
            admin/dist/assets/ "$USER@$HOST:$ADMIN_PATH/assets/"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            "$RUNNER_TEMP/qismat.env" "$USER@$HOST:$API_PATH/.env.${GITHUB_RUN_ID}.tmp"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            .github/scripts/merge-dotenv.php "$USER@$HOST:$API_PATH/.merge-dotenv.${GITHUB_RUN_ID}.php"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            "$RUNNER_TEMP/firebase-service-account.json" \
            "$USER@$HOST:$API_PATH/.secrets/firebase-service-account.json.${GITHUB_RUN_ID}.tmp"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -P "${PORT:-22}" \
            .github/scripts/activate-cpanel-release.sh .github/scripts/rollback-cpanel-release.sh \
            "$USER@$HOST:$API_PATH/deployment/"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            bash -s -- "$API_PATH" "$GITHUB_RUN_ID" "$RELEASE_ID" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          api_path="$1"
          run_id="$2"
          release_id="$3"
          release_sha="$4"
          release_path="$api_path/releases/$release_id"
          test "$release_path" = "$api_path/releases/$release_id"
          test -f "$release_path/artisan"
          cd "$api_path"
          cleanup() {
            rm -f ".env.${run_id}.tmp" ".env.${run_id}.new" ".merge-dotenv.${run_id}.php"
          }
          trap cleanup EXIT
          php ".merge-dotenv.${run_id}.php" .env ".env.${run_id}.tmp" ".env.${run_id}.new"
          chmod 600 ".env.${run_id}.new"
          mv ".env.${run_id}.new" .env
          mv ".secrets/firebase-service-account.json.${run_id}.tmp" .secrets/firebase-service-account.json
          chmod 600 .env .secrets/firebase-service-account.json
          mkdir -p storage/app/public storage/app/private storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX storage
          rm -rf "$release_path/storage"
          ln -s "$api_path/storage" "$release_path/storage"
          ln -s "$api_path/.env" "$release_path/.env"
          ln -s "$api_path/storage/app/public" "$release_path/public/storage"
          chmod -R u+rwX "$release_path/bootstrap/cache"
          chmod 700 deployment
          chmod 700 deployment/activate-cpanel-release.sh deployment/rollback-cpanel-release.sh
          printf '%s\n' "$release_sha" > "$release_path/RELEASE_SHA"
          cd "$release_path"
          php artisan optimize:clear
          php artisan migrate --force
          php artisan optimize
          REMOTE

      - name: Activate release
        id: activate
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          ADMIN_PATH: ${{ secrets.CPANEL_ADMIN_PATH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            "$API_PATH/deployment/activate-cpanel-release.sh" "$API_PATH" "$WEB_PATH" "$ADMIN_PATH" "$RELEASE_ID"

      - name: Verify API health
        run: |
          health_file="$RUNNER_TEMP/qismat-api-health.json"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://admin.qismatconnections.com/api/v1/health > "$health_file"
          php -r '
          $payload = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
          if (($payload["success"] ?? null) !== true || ($payload["data"]["service"] ?? null) !== "qismat-api") {
              fwrite(STDERR, "Unexpected API health response".PHP_EOL);
              exit(1);
          }
          ' "$health_file"

      - name: Verify frontend releases
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 https://qismatconnections.com/ \
            | grep -F 'Qismat Connections' >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 3 https://admin.qismatconnections.com/ \
            | grep -F 'Qismat Admin' >/dev/null

      - name: Roll back failed activation
        if: failure() && steps.activate.outcome != 'skipped' && steps.activate.outcome != 'cancelled'
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          ADMIN_PATH: ${{ secrets.CPANEL_ADMIN_PATH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_deploy -p "${PORT:-22}" "$USER@$HOST" \
            bash -s -- "$API_PATH" "$WEB_PATH" "$ADMIN_PATH" "$RELEASE_ID" <<'REMOTE'
          set -euo pipefail
          api_path="$1"
          web_path="$2"
          admin_path="$3"
          failed_release="$4"
          active_release=""
          if [[ -L "$api_path/current" ]]; then
            active_release="$(basename "$(readlink "$api_path/current")")"
          fi
          if [[ "$active_release" != "$failed_release" && ! -f "$web_path/index.html.legacy-$failed_release" ]]; then
            echo "Release activation did not switch the live entry points; no rollback is required."
            exit 0
          fi
          if [[ -L "$api_path/previous" && -L "$web_path/previous" && -L "$admin_path/previous" ]]; then
            previous_release="$(basename "$(readlink "$api_path/previous")")"
            "$api_path/deployment/rollback-cpanel-release.sh" "$api_path" "$web_path" "$admin_path" "$previous_release"
          else
            test -f "$web_path/index.html.legacy-$failed_release"
            test -f "$admin_path/index.html.legacy-$failed_release"
            mv -Tf "$web_path/index.html.legacy-$failed_release" "$web_path/index.html"
            mv -Tf "$admin_path/index.html.legacy-$failed_release" "$admin_path/index.html"
            ln -sfn "$api_path/public/index.php" "$admin_path/_qismat_api.php"
            ln -sfn "$api_path/storage/app/public" "$admin_path/storage"
            echo "Restored the pre-atomic legacy release. Database migrations were not reversed."
          fi
          REMOTE
