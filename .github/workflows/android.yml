name: Android
on:
  push:
    branches: [main, foundation/initial-platform]
    paths: ['mobile/**','.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**','.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: flutter create --platforms=android,ios --org com.qismat .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=https://admin.qismatconnections.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: qismat-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
