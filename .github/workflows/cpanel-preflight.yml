name: cPanel Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-host:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KEY_PASSPHRASE"
          test -n "$DATABASE_NAME"
          test -n "$DATABASE_USER"
          test -n "$DATABASE_PASSWORD"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/qismat_preflight
          chmod 600 ~/.ssh/qismat_preflight
          eval "$(ssh-agent -s)"
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_KEY_PASSPHRASE"' > "$RUNNER_TEMP/qismat_ssh_askpass"
          chmod 700 "$RUNNER_TEMP/qismat_ssh_askpass"
          SSH_ASKPASS="$RUNNER_TEMP/qismat_ssh_askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            ssh-add ~/.ssh/qismat_preflight < /dev/null
          rm -f "$RUNNER_TEMP/qismat_ssh_askpass"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts

      - name: Check server versions
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_preflight -p "${PORT:-22}" "$USER@$HOST" \
            'php -v && composer --version && (mysql --version || mariadb --version) && node -v && npm -v && git --version'

      - name: Check database credentials
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          REMOTE_CREDENTIAL_FILE: /tmp/qismat-db-check-${{ github.run_id }}.cnf
        run: |
          printf '[client]\nuser=%s\npassword=%s\nhost=localhost\n' "$DATABASE_USER" "$DATABASE_PASSWORD" > database-check.cnf
          chmod 600 database-check.cnf
          scp -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_preflight -P "${PORT:-22}" database-check.cnf "$USER@$HOST:$REMOTE_CREDENTIAL_FILE"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_preflight -p "${PORT:-22}" "$USER@$HOST" \
            "chmod 600 '$REMOTE_CREDENTIAL_FILE' && (mysql --defaults-extra-file='$REMOTE_CREDENTIAL_FILE' '$DATABASE_NAME' -e 'SELECT 1 AS connection_ok' || mariadb --defaults-extra-file='$REMOTE_CREDENTIAL_FILE' '$DATABASE_NAME' -e 'SELECT 1 AS connection_ok')"

      - name: Remove temporary database credentials
        if: always()
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          USER: ${{ secrets.CPANEL_USER }}
          PORT: ${{ secrets.CPANEL_PORT }}
          REMOTE_CREDENTIAL_FILE: /tmp/qismat-db-check-${{ github.run_id }}.cnf
        run: |
          rm -f database-check.cnf
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/qismat_preflight -p "${PORT:-22}" "$USER@$HOST" "rm -f '$REMOTE_CREDENTIAL_FILE'" || true
